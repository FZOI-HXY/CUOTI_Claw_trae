# ======================================================
# Claw 错题管理系统 - Nginx 反向代理配置
# ======================================================
#
# 功能：
#   - HTTPS 终止
#   - 静态文件缓存
#   - 上传大小限制
#   - 安全响应头
#   - gzip 压缩
#
# 使用方法：
#   1. 将证书放入 ./deploy/nginx/certs/ 目录
#      - fullchain.pem  (证书链)
#      - privkey.pem    (私钥)
#   2. docker compose --profile production up -d
# ======================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- 日志格式 ----------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---------- 基础优化 ----------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;  # 隐藏 nginx 版本号

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------- 上传大小限制（与 MAX_UPLOAD_SIZE_MB 对应） ----------
    client_max_body_size 100m;

    # ---------- 后端上游 ----------
    upstream claw_backend {
        server claw-app:8500;
        keepalive 32;
    }

    # ---------- HTTP -> HTTPS 重定向 ----------
    server {
        listen 80;
        server_name _;

        # 健康检查端点（保留 HTTP，无需 HTTPS）
        location /api/health {
            proxy_pass http://claw_backend;
            access_log off;
        }

        # 其余请求重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS 主服务 ----------
    server {
        listen 443 ssl http2;
        server_name _;

        # ---------- SSL 证书 ----------
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ---------- SSL 优化 ----------
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---------- 安全响应头 ----------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---------- 代理转发到 FastAPI 后端 ----------
        location / {
            proxy_pass http://claw_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（如有需要）
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置（OCR 处理可能较慢）
            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # ---------- 静态前端缓存 ----------
        location /app {
            proxy_pass http://claw_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 静态资源缓存 1 小时
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # ---------- 健康检查（不记日志） ----------
        location /api/health {
            proxy_pass http://claw_backend;
            access_log off;
        }
    }
}
