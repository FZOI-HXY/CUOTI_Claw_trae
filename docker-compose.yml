# ======================================================
# Claw 错题管理系统 - docker-compose.yml
# 一键部署：Web 服务 + Nginx 反向代理（可选）
# ======================================================
#
# 使用方法：
#   1. 复制 .env.example 为 .env 并填写 PaddleOCR API Key
#   2. docker compose up -d
#   3. 访问 http://<服务器IP>:8500/app
#
# 常用命令：
#   docker compose up -d          # 后台启动
#   docker compose logs -f        # 查看日志
#   docker compose restart        # 重启
#   docker compose down           # 停止并移除容器
#   docker compose pull && docker compose up -d  # 更新镜像
# ======================================================

services:
  # ---------- Claw Web 应用 ----------
  claw-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: claw-app:latest
    container_name: claw-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8500
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CLAW_DATA_DIR=/app/data
    volumes:
      # 持久化数据（上传文件、报告、数据库、日志）
      - claw-uploads:/app/data/uploads
      - claw-output:/app/data/output
      - claw-logs:/app/data/logs
    ports:
      - "8500:8500"
    expose:
      - "8500"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8500/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - claw-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- Nginx 反向代理（可选，生产环境推荐） ----------
  # 功能：
  #   - HTTPS 终止（需挂载证书）
  #   - 静态文件缓存
  #   - 请求大小限制（防止大文件攻击）
  #   - 安全响应头
  # 启用方法：docker compose --profile production up -d
  nginx:
    image: nginx:alpine
    container_name: claw-nginx
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      claw-app:
        condition: service_healthy
    networks:
      - claw-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ---------- 数据卷 ----------
volumes:
  claw-uploads:
    driver: local
  claw-output:
    driver: local
  claw-logs:
    driver: local

# ---------- 网络 ----------
networks:
  claw-net:
    driver: bridge
